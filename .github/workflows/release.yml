name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the release key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Moekoma.apk
      # The app updates itself only from an APK with the same signature. A release with no signature must fail here.
      - name: Check the signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs Moekoma.apk | tee certs.txt
          grep -q "CN=Stiven Gjekaj, O=Moekoma" certs.txt
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Moekoma.apk \
            --title "Moekoma $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. The newest APK is always at https://github.com/${{ github.repository }}/releases/latest/download/Moekoma.apk"
